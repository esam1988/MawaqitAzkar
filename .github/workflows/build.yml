name: Build Mawaqit Smart Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install only platform-tools here. Omitting "packages" can make
      # setup-android request the obsolete SDK package named "tools".
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \\
            "platforms;android-35" \\
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Smart Launcher source
        run: |
          unzip -o MawaqitAzkar-SmartLauncher-v1.2.zip -d source

      - name: Build APK
        run: |
          cd source
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mawaqit-Smart-Launcher-v1.2
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
